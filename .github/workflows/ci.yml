name: CI

on:
  # Maintenance happens on main; pull requests come from outside contributors.
  push:
    branches: [main]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request makes its older run pointless; every commit on main keeps its
# own run, so a failing commit is never hidden by the next one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MISE_ENV: ci
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: Format, clippy and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      # The libsane crate needs libsane to link and libclang for bindgen; the SANE tests need
      # libsane at run time.
      - name: Install libsane
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libsane-dev libsane1 libclang-dev pkg-config
      - uses: jdx/mise-action@v5.2.7
      - uses: Swatinem/rust-cache@v2.9.3
      - run: mise run lint
      - run: mise run doc
      - run: mise run test
      # The SANE tests are ignored by default; this runs them against libsane's virtual test
      # backend (the task sets RECTO_SANE_TESTS and SANE_CONFIG_DIR).
      - run: mise run test-sane
      - run: mise run deny

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    env:
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7.0.1
      # Linked like the check job: the server links libsane.
      - name: Install libsane
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libsane-dev libsane1 libclang-dev pkg-config
      - uses: jdx/mise-action@v5.2.7
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: coverage
      - run: mise run coverage
      - name: Summarize
        run: |
          {
            echo '## Coverage'
            echo '```'
            mise exec -- cargo llvm-cov report --summary-only $RECTO_SERVER_PACKAGES | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Pull requests from forks and Dependabot get no secrets, and the owner may not have added
      # CODECOV_TOKEN yet: the upload only fails the job when a token was there to use.
      - uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          disable_search: true
          fail_ci_if_error: ${{ env.HAS_CODECOV_TOKEN == 'true' }}

  image:
    name: Container image (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          tags: recto:ci
          platforms: linux/${{ matrix.architecture }}
          cache-from: type=gha,scope=image-${{ matrix.architecture }}
          cache-to: type=gha,scope=image-${{ matrix.architecture }},mode=max
      # Through compose.yml, so the file users start from is tested too. The identity provider is
      # never contacted at startup, so dummy values are enough for the image to turn healthy.
      - name: Start the image and wait until it reports healthy
        run: |
          mkdir consume
          sudo chown 65532:65532 consume
          # "Save" runs as 65532, so prove the folder the quick start prepares is writable by it.
          docker compose run --rm --no-deps --entrypoint sh recto \
            -c 'touch /consume/.probe && rm /consume/.probe'
          if ! docker compose up --detach --no-build --wait --wait-timeout 150; then
            docker compose logs
            exit 1
          fi
          curl --fail --silent http://localhost:8080/health
        env:
          RECTO_IMAGE: recto:ci
          RECTO_PUBLIC_URL: http://localhost:8080
          RECTO_OIDC_ISSUER: http://127.0.0.1:9/
          RECTO_OIDC_CLIENT_ID: recto-ci
      - name: Report size
        run: docker image ls recto:ci

  # The one check branch protection requires: it fails unless every job above succeeded, so
  # adding a job here needs no change to the repository settings.
  passed:
    name: CI passed
    if: always()
    needs: [check, coverage, image]
    runs-on: ubuntu-24.04
    steps:
      - name: Check that every job succeeded
        run: |
          echo "$RESULTS" | jq --exit-status 'all(.[]; .result == "success")' > /dev/null || {
            echo "$RESULTS" | jq --raw-output 'to_entries[] | "\(.key): \(.value.result)"'
            echo "::error::A required job did not succeed"
            exit 1
          }
        env:
          RESULTS: ${{ toJSON(needs) }}
