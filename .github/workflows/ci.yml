name: CI

on:
  # Pull requests must pass before they merge; main runs again once they have.
  push:
    branches: [main]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request makes its older run pointless; every commit on main keeps its
# own run, so a failing commit is never hidden by the next one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MISE_ENV: ci
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: Format, clippy and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      # The libsane crate needs libsane to link and libclang for bindgen; the SANE tests need
      # libsane at run time.
      - name: Install libsane
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libsane-dev libsane1 libclang-dev pkg-config
      - uses: jdx/mise-action@v5.2.10
      - uses: Swatinem/rust-cache@v2.9.3
      - run: mise run lint
      - run: mise run doc
      - run: mise run test
      # The SANE tests are ignored by default; this runs them against libsane's virtual test
      # backend (the task sets RECTO_SANE_TESTS and SANE_CONFIG_DIR).
      - run: mise run test-sane
      - run: mise run deny

  postgres:
    name: Tests on PostgreSQL
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: recto
          POSTGRES_PASSWORD: recto
          POSTGRES_DB: recto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username recto --dbname recto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RECTO_TEST_DATABASE_URL: postgres://recto:recto@localhost:5432/recto
    steps:
      - uses: actions/checkout@v7.0.1
      # Linked like the check job: the server links libsane.
      - name: Install libsane
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libsane-dev libsane1 libclang-dev pkg-config
      - uses: jdx/mise-action@v5.2.10
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: postgres
      - run: mise run test-postgres

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    env:
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7.0.1
      # Linked like the check job: the server links libsane.
      - name: Install libsane
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libsane-dev libsane1 libclang-dev pkg-config
      - uses: jdx/mise-action@v5.2.10
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: coverage
      - run: mise run coverage
      - name: Summarize
        run: |
          {
            echo '## Coverage'
            echo '```'
            mise exec -- cargo llvm-cov report --summary-only $RECTO_SERVER_PACKAGES | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Pull requests from forks and Dependabot get no secrets, and the owner may not have added
      # CODECOV_TOKEN yet: the upload only fails the job when a token was there to use.
      - uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          disable_search: true
          fail_ci_if_error: ${{ env.HAS_CODECOV_TOKEN == 'true' }}

  image:
    name: Container image (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          tags: recto:ci
          platforms: linux/${{ matrix.architecture }}
          cache-from: type=gha,scope=image-${{ matrix.architecture }}
          cache-to: type=gha,scope=image-${{ matrix.architecture }},mode=max
      # Through compose.yml, so the file users start from is tested too, with its defaults: local
      # accounts and SQLite on the recto-data volume, without an identity provider.
      - name: Start the image and wait until it reports healthy
        run: |
          mkdir consume
          sudo chown 65532:65532 consume
          # "Save" runs as 65532, so prove the folder the quick start prepares is writable by it,
          # from BusyBox since the image has no shell.
          docker run --rm --user 65532:65532 --volume "$PWD/consume:/consume" \
            busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec \
            sh -c 'touch /consume/.probe && rm /consume/.probe'
          if ! docker compose up --detach --no-build --wait --wait-timeout 150; then
            docker compose logs
            exit 1
          fi
          curl --fail --silent http://localhost:8080/health
        env:
          RECTO_IMAGE: recto:ci
          RECTO_PUBLIC_URL: http://localhost:8080
      # The quick start's first administrator, then a password sign-in, which must redirect home.
      - name: Create an administrator and sign in
        run: |
          echo 'ci-password-long-enough' |
            docker compose exec -T recto /app/recto create-administrator --username admin
          status=$(curl --silent --output /dev/null --write-out '%{http_code} %{redirect_url}' \
            --cookie-jar cookies.txt \
            --header 'Origin: http://localhost:8080' \
            --data 'login=admin&password=ci-password-long-enough&next=/' \
            http://localhost:8080/sign-in)
          echo "$status"
          test "$status" = "303 http://localhost:8080/"
        env:
          RECTO_IMAGE: recto:ci
          RECTO_PUBLIC_URL: http://localhost:8080
      # The Printers page manages CUPS through the shared socket: add a queue (a generic driver and
      # an address nothing answers at, which only a PPD driver accepts without contacting it), see
      # it in CUPS itself, then remove it.
      - name: Add and remove a printer through recto
        run: |
          printers() {
            curl --silent --output /dev/null --write-out '%{http_code} %{redirect_url}' \
              --cookie cookies.txt --header 'Origin: http://localhost:8080' "$@"
          }
          status=$(printers \
            --data-urlencode 'name=ci' \
            --data-urlencode 'address=ipp://192.0.2.12/ipp/print' \
            --data-urlencode 'driver=drv:///sample.drv/generic.ppd' \
            http://localhost:8080/administration/printers/add)
          echo "$status"
          test "$status" = "303 http://localhost:8080/administration/printers?done=added"
          docker compose exec -T cups lpstat -p ci
          status=$(printers --data 'printer=ci&confirm=yes' \
            http://localhost:8080/administration/printers/remove)
          echo "$status"
          test "$status" = "303 http://localhost:8080/administration/printers?done=removed"
          if docker compose exec -T cups lpstat -p ci; then
            echo '::error::The printer is still there'
            exit 1
          fi
        env:
          RECTO_IMAGE: recto:ci
          RECTO_PUBLIC_URL: http://localhost:8080
      - name: Report size
        run: docker image ls recto:ci

  # The one check branch protection requires: it fails unless every job above succeeded, so
  # adding a job here needs no change to the repository settings.
  passed:
    name: CI passed
    if: always()
    needs: [check, postgres, coverage, image]
    runs-on: ubuntu-24.04
    steps:
      - name: Check that every job succeeded
        run: |
          echo "$RESULTS" | jq --exit-status 'all(.[]; .result == "success")' > /dev/null || {
            echo "$RESULTS" | jq --raw-output 'to_entries[] | "\(.key): \(.value.result)"'
            echo "::error::A required job did not succeed"
            exit 1
          }
        env:
          RESULTS: ${{ toJSON(needs) }}
