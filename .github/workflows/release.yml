name: Release

# Publishes the multi-architecture container image to the GitHub Container Registry, copies it to
# Docker Hub and publishes the GitHub release. Both architectures build natively on their own
# runners.
#
# release-plz.yml calls it after tagging a merged release PR. A version tag pushed by hand also
# starts it, and it can be run again for an existing tag from the Actions tab.
on:
  workflow_call:
    inputs:
      tag:
        description: Version tag to release, such as v1.2.3
        type: string
        required: true
    secrets:
      DOCKERHUB_TOKEN:
        description: Docker Hub access token (read, write, delete) of the DOCKERHUB_USERNAME variable's account
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to release, such as v1.2.3
        type: string
        required: true
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Name the image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build and push the image by digest
        id: image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.architecture }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ matrix.architecture }}
          cache-to: type=gha,scope=release-${{ matrix.architecture }},mode=max
          provenance: mode=max
      - name: Export the digest
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: digest-${{ matrix.architecture }}
          path: digests/*
          if-no-files-found: error

  image:
    name: Publish the image
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Name the image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - id: metadata
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # `auto` tags `latest` only for a stable version, never for a pre-release.
          flavor: latest=auto
          # Pre-releases get no `latest`, minor or major tag.
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=semver,pattern={{major}},value=${{ env.TAG }}
      - name: Merge the architectures into one tag
        working-directory: digests
        run: |
          docker buildx imagetools create \
            $(jq --raw-output '.tags | map("--tag " + .) | join(" ")' <<< "$METADATA") \
            $(printf "$IMAGE@sha256:%s " *)
        env:
          METADATA: ${{ steps.metadata.outputs.json }}
      - name: Inspect the image
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.metadata.outputs.version }}"

  # A copy of the image on Docker Hub, where most people look for images first. The tags are
  # copied from the GitHub Container Registry, so both registries serve the same digests, and the
  # repository's description follows the README. Skipped without the DOCKERHUB_USERNAME variable
  # (forks); a failure here does not hold the GitHub release back.
  docker-hub:
    name: Copy the image to Docker Hub
    needs: image
    if: vars.DOCKERHUB_USERNAME != ''
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: read
      packages: read
    env:
      HUB_IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/recto
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.HUB_IMAGE }}
          # The same tags as on the GitHub Container Registry.
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=semver,pattern={{major}},value=${{ env.TAG }}
      - name: Copy the image
        run: |
          docker buildx imagetools create \
            $(jq --raw-output '.tags | map("--tag " + .) | join(" ")' <<< "$METADATA") \
            "ghcr.io/${GITHUB_REPOSITORY,,}:${{ steps.metadata.outputs.version }}"
        env:
          METADATA: ${{ steps.metadata.outputs.json }}
      - name: Inspect the image
        run: docker buildx imagetools inspect "$HUB_IMAGE:${{ steps.metadata.outputs.version }}"
      - name: Update the description
        uses: peter-evans/dockerhub-description@v5.0.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/recto
          short-description: 'Print and scan from any browser through your home server: CUPS, SANE, local accounts or OIDC'
          readme-filepath: README.md
          # The README links to the guide and to files of the repository by relative paths.
          enable-url-completion: true

  release:
    name: GitHub release
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # release-plz drafts the release with the changelog; a hand-pushed tag has none yet.
      - name: Publish the release
        run: |
          prerelease=false
          if [[ "$TAG" == *-* ]]; then prerelease=true; fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft=false --prerelease="$prerelease"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "recto $TAG" --generate-notes --verify-tag --prerelease="$prerelease"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
