name: Release

# Publishes the multi-architecture container image to the GitHub Container Registry when a
# version tag is pushed. Both architectures build natively on their own runners.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to release, such as v1.2.3
        type: string
        required: true
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Name the image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build and push the image by digest
        id: image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.architecture }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ matrix.architecture }}
          cache-to: type=gha,scope=release-${{ matrix.architecture }},mode=max
          provenance: mode=max
      - name: Export the digest
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: digest-${{ matrix.architecture }}
          path: digests/*
          if-no-files-found: error

  image:
    name: Publish the image
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Name the image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - id: metadata
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # `auto` tags `latest` only for a stable version, never for a pre-release.
          flavor: latest=auto
          # Pre-releases get no `latest`, minor or major tag.
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=semver,pattern={{major}},value=${{ env.TAG }}
      - name: Merge the architectures into one tag
        working-directory: digests
        run: |
          docker buildx imagetools create \
            $(jq --raw-output '.tags | map("--tag " + .) | join(" ")' <<< "$METADATA") \
            $(printf "$IMAGE@sha256:%s " *)
        env:
          METADATA: ${{ steps.metadata.outputs.json }}
      - name: Inspect the image
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.metadata.outputs.version }}"
