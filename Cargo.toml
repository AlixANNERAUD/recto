[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/AlixANNERAUD/recto"
authors = ["Alix ANNERAUD <alix@anneraud.fr>"]
publish = false

[workspace.dependencies]
recto-printing = { path = "crates/printing" }
recto-scanning = { path = "crates/scanning" }
recto-authentication = { path = "crates/authentication" }
recto-app = { path = "crates/app", default-features = false }
recto-entity = { path = "crates/entity" }
recto-migration = { path = "crates/migration" }
recto-domain = { path = "crates/domain" }

leptos = { version = "0.8.23", features = ["islands"] }
leptos_axum = "0.8.10"
leptos_router = "0.8.17"
leptos_meta = "0.8.7"
axum = { version = "0.8.9", features = ["macros"] }
tower-http = { version = "0.7.1", features = ["compression-gzip", "trace", "timeout", "fs"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
url = "2.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
console_error_panic_hook = "0.1"
embedded-i18n = "0.2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
bytes = "1"
# The models only need the attribute types; the `service` feature of recto-printing adds the client.
ipp = { version = "8.0.0", default-features = false }
async-trait = "0.1"
percent-encoding = "2.3"
wiremock = "0.6.5"
uuid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
# Only the codecs recto writes; scanned pages are never decoded from untrusted files.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tempfile = "3"
# Page counts of the PDFs sent to print (crates/printing/src/count.rs); only the parser is used, none of the optional features.
lopdf = { version = "0.47.0", default-features = false }
# The images of the PDFs that PWG and Apple rasters become (crates/printing/src/raster.rs): the
# zlib streams of PDF's FlateDecode, with the Rust backend lopdf already builds.
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
# IANA zones of RECTO_TIMEZONE, which the quota periods are calendar periods in.
chrono-tz = { version = "0.10.4", default-features = false }
rpassword = "7.5"
serde_json = "1"
openidconnect = { version = "4.1.0", default-features = false, features = ["reqwest", "rustls-tls"] }
# Sessions live in the accounts database (crates/server/src/session_store.rs).
tower-sessions = { version = "0.15.0", default-features = false, features = ["axum-core"] }
tower = { version = "0.5.3", features = ["util"] }
# Both listeners serve their connections themselves (crates/server/src/connections.rs): axum's
# `serve` gives hyper no timer, so idle connections would never be closed.
hyper = { version = "1.12.0", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio", "server-graceful", "http1"] }
# rustls lets PostgreSQL connections use TLS (`sslmode` in the URL), as managed databases require.
sea-orm = { version = "2.0.4", default-features = false, features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono", "with-json"] }
sea-orm-migration = { version = "2.0.4", default-features = false, features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls"] }
# Argon2id hashing of local account passwords.
password-auth = "2.0.0"
# Rate limit of password sign-in per client address.
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"] }
# The secrets of device passwords: drawn from the system's random source, written in base32,
# stored as their SHA-256 in hex; data-encoding also reads the base64 of HTTP Basic credentials.
getrandom = { version = "0.4.3", default-features = false }
data-encoding = { version = "2.11.1", default-features = false, features = ["alloc"] }
sha2 = { version = "0.11.1", default-features = false }
# Tests of the IPP routes send bodies in chunks they count, as a stream.
futures-core = { version = "0.3.34", default-features = false }
# The XML of eSCL scanning (crates/scanning/src/escl): a pull parser that resolves namespaces,
# never expands entities beyond the predefined ones and reports a DOCTYPE as an event to refuse.
quick-xml = { version = "0.42.0", default-features = false }
# The LAN listener's TLS (crates/server/src/lan.rs), on ring like every other TLS user in the
# lockfile: aws-lc-rs would bring cmake and bindgen into the arm64 build.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
# The LAN listener's self-signed certificate, generated once and kept in the data directory.
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
# The mDNS responder that advertises the LAN listener (RECTO_DNSSD): pure Rust, its own thread.
# recto only registers services, so it needs none of the async receivers.
mdns-sd = { version = "0.22.0", default-features = false, features = ["logging"] }
# Interface names and flags for RECTO_DNSSD_INTERFACES; mdns-sd already depends on it.
if-addrs = { version = "0.15.0", default-features = false }
# The networks of RECTO_ESCL_OPEN_NETWORKS, which may scan without credentials; reqwest already
# depends on it.
ipnet = { version = "2.12.2", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Dependencies without debug information keep test binaries small and quick to link.
[profile.dev.package."*"]
debug = false

# The server draws, resizes and encodes its icons at startup, which every test of the router
# repeats; unoptimized, the image code takes a second there.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

# Leptos views are nested generic types; their full debug information made linking the test
# binaries need several gigabytes. Line tables keep backtraces readable.
[profile.dev.package.recto-app]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = true
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = "z"
panic = "abort"

[[workspace.metadata.leptos]]
name = "recto"
bin-package = "recto"
lib-package = "recto-frontend"
output-name = "recto"
site-root = "target/site"
site-pkg-dir = "pkg"
tailwind-input-file = "style/main.css"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
env = "DEV"
lib-profile-release = "wasm-release"

# mdns-sd answers unicast queries from off-link sources, which lets a spoofed query from the
# internet turn recto into an amplifier (keepsimple1/mdns-sd#558). The fix, pinned here, is
# keepsimple1/mdns-sd#559; drop this patch for the first mdns-sd release that includes it.
[patch.crates-io]
mdns-sd = { git = "https://github.com/AlixANNERAUD/mdns-sd", rev = "2628df08d1ecdb3c314fb3d467161aac5ce2ab71" }
