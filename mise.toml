[tools]
rust = { version = "1.99.1", components = "rustfmt,clippy,llvm-tools", targets = "wasm32-unknown-unknown", mr_boxington = true }
mr-boxington = "latest"
"github:leptos-rs/cargo-leptos" = "0.3.11"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.149"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
# Generates the entities from the migrated schema (mise run entities).
"github:SeaQL/sea-orm" = { version = "2.0.4", version_prefix = "sea-orm-cli@", bin = "sea-orm-cli" }
# Must match the wasm-bindgen version in Cargo.lock. The statically linked (musl) build runs on
# any Linux, including the Debian 12 image builder whose glibc is older than the gnu build needs.
"github:wasm-bindgen/wasm-bindgen" = { version = "0.2.130", matching = "unknown-linux-musl" }
# cargo-leptos uses these from the PATH instead of downloading them at each clean build (GitHub
# refusing those downloads was failing builds). The versions are cargo-leptos 0.3.11's defaults.
"github:WebAssembly/binaryen" = { version = "123", version_prefix = "version_" }
"aqua:tailwindlabs/tailwindcss" = "4.2.1"
# Writes the SBOM nanobom receives (mise run sbom, .github/workflows/sbom.yml).
"github:CycloneDX/cyclonedx-rust-cargo" = { version = "0.5.10", version_prefix = "cargo-cyclonedx-", bin = "cargo-cyclonedx" }
# Builds the documentation in docs/ (mise run docs).
"github:rust-lang/mdBook" = { version = "0.5.4", bin = "mdbook" }
# Draws the Mermaid diagrams of the documentation. The release ships the mermaid.min.js and
# mermaid-init.js that `mdbook-mermaid install docs` copied into docs/: update them together.
"github:badboy/mdbook-mermaid" = "0.17.1"

[env]
# The browser bundle is built separately for wasm32, so server-side commands leave it out to
# avoid unifying the `ssr` and `hydrate` features of the interface crate.
RECTO_SERVER_PACKAGES = "--workspace --exclude recto-frontend"

[tasks.format]
description = "Format the code"
run = "cargo fmt --all"

[tasks.lint]
description = "Check formatting and run clippy on the server and browser code"
run = [
  "cargo fmt --all --check",
  "cargo clippy $RECTO_SERVER_PACKAGES --all-targets -- -D warnings",
  "cargo clippy --package recto-frontend --target wasm32-unknown-unknown -- -D warnings",
]

[tasks.test]
description = "Run the test suite"
run = "cargo nextest run $RECTO_SERVER_PACKAGES --no-tests=pass"

# Warnings are errors, so a broken intra-doc link or a malformed doc comment fails CI.
[tasks.doc]
description = "Build the API documentation, failing on rustdoc warnings"
run = "cargo doc $RECTO_SERVER_PACKAGES --no-deps --document-private-items"

[tasks.doc.env]
RUSTDOCFLAGS = "-D warnings"

# The tests recreate the schema of the database in RECTO_TEST_DATABASE_URL for each test, so
# they run one at a time. Without the variable they would quietly run on SQLite instead.
[tasks.test-postgres]
description = "Run the test suite on the PostgreSQL database in RECTO_TEST_DATABASE_URL"
run = [
  'case "$RECTO_TEST_DATABASE_URL" in postgres://*|postgresql://*) ;; *) echo "Set RECTO_TEST_DATABASE_URL to an empty PostgreSQL database, such as postgres://recto:recto@localhost:5432/recto" >&2; exit 1 ;; esac',
  "cargo nextest run $RECTO_SERVER_PACKAGES --no-tests=pass --test-threads 1",
]

[tasks.docs]
description = "Build the documentation into docs/book"
run = "mdbook build docs"

# cargo-cyclonedx writes one SBOM per workspace crate; crates/server/sbom.json describes the
# released binary.
[tasks.sbom]
description = "Write the CycloneDX SBOM of the server to crates/server/sbom.json"
run = "cargo cyclonedx --format json --spec-version 1.6 --override-filename sbom"

[tasks.coverage]
description = "Run the test suite with coverage, writing lcov.info"
run = "cargo llvm-cov nextest $RECTO_SERVER_PACKAGES --no-tests=pass --lcov --output-path lcov.info"

[tasks.deny]
description = "Check advisories, licences, bans and sources"
run = "cargo deny check"

[tasks.check]
description = "Everything CI checks, except the release build"
depends = ["lint", "doc", "test", "deny"]

# The `dev-mocks` feature and `RECTO_DEV_MOCKS=1` (set below) swap CUPS and SANE for mocks and sign
# every request in, to try the interface without hardware; the feature only exists in debug builds.
# cargo-leptos 0.3.11 reads the binary's arguments from its command line only (there is no
# `bin-args` key in the workspace metadata), hence `-- serve`. cargo-leptos itself runs with
# `site-addr` and `site-root` from Cargo.toml, which these values must match.
[tasks.dev]
description = "Run the server with live reload on http://127.0.0.1:3000"
run = "cargo leptos watch --bin-features dev-mocks -- serve"

[tasks.dev.env]
RECTO_SITE_ROOT = "target/site"
RECTO_LISTEN_ADDRESS = "127.0.0.1:3000"
RECTO_PUBLIC_URL = "http://127.0.0.1:3000"
RECTO_LOG_FORMAT = "text"
RECTO_DEV_MOCKS = "1"
# A database of its own under target/, so the development user and sessions survive restarts.
RECTO_DATABASE_URL = "sqlite://target/dev.db"

[tasks.build]
description = "Build the release binary and the site"
run = "cargo leptos build --release"

# libsane reads its backends once per process and allows one instance, so these tests (ignored
# by default) run in their own invocation. CI sets `RECTO_SANE_TESTS` and `SANE_CONFIG_DIR`, see
# crates/scanning/tests/sane_test_backend.rs.
[tasks.test-sane]
description = "Run the SANE tests against libsane's virtual test backend (needs libsane)"
run = "cargo nextest run --package recto-scanning --run-ignored only --no-tests=fail"

[tasks.test-sane.env]
RECTO_SANE_TESTS = "1"
SANE_CONFIG_DIR = "{{config_root}}/crates/scanning/tests/sane-config"

# The throwaway database and the generated files live under target/ rather than the system
# temporary directory, and the committed entities are only replaced once generation succeeded.
# `recto migrate` applies the migrations to a throwaway SQLite file.
[tasks.entities]
description = "Regenerate the SeaORM entities from the migrations"
run = '''
set -eu
directory=target/entities-schema
rm -rf "$directory"
mkdir -p "$directory"
cargo run --quiet --package recto -- migrate --database-url "sqlite://$PWD/$directory/schema.db"
sea-orm-cli generate entity --database-url "sqlite://$PWD/$directory/schema.db" --output-dir "$directory/entities" --with-serde both --date-time-crate chrono --ignore-tables seaql_migrations --banner-version off
rm -rf crates/entity/src/entities
mv "$directory/entities" crates/entity/src/entities
rm -rf "$directory"
cargo fmt --package recto-entity
'''
