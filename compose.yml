# recto with Docker Compose:
#
#   mkdir -p consume && sudo chown 65532:65532 consume
#   RECTO_PUBLIC_URL=https://recto.example.org docker compose up -d --wait
#   docker compose exec recto /app/recto create-administrator --username admin
#
# or put the variables in a `.env` file next to this one, then open http://localhost:8080. The
# published image is used (amd64 and arm64); with `docker compose up --build` it is built from this
# checkout.
#
# People sign in with a local account, a username and a password, or through an OpenID Connect
# provider, or both. The first administrator is created with the command above and creates the
# other local accounts. For single sign-on, set RECTO_OIDC_ISSUER and RECTO_OIDC_CLIENT_ID: the
# provider needs a public client (authorization code with PKCE) whose redirect URI is
# $RECTO_PUBLIC_URL/auth/callback. Every RECTO_* variable of docs/src/reference/configuration.md
# works under `environment`.
#
# recto runs as uid and gid RECTO_UID (65532 by default), so the folder behind "Save" must be
# writable by it (the chown above). To save into an existing folder owned by someone else, such as
# Paperless's consume folder, set RECTO_UID to that owner's uid instead: the cups service gives its
# `recto` account the same uid, which CUPS needs to recognize recto.
#
# Printers: administrators add and manage them on recto's Printers page. recto talks to CUPS's
# local socket, shared through the cups-socket volume (see examples/cups/cups-files.conf). The
# command line works too:
#   docker compose exec cups lpadmin -p office -E -v ipp://192.168.1.60/ipp/print -m everywhere
# Scanners: see the sane-airscan lines below.
services:
  recto:
    image: ${RECTO_IMAGE:-ghcr.io/alixanneraud/recto:latest}
    build: .
    restart: unless-stopped
    # The same uid as the `recto` account of the cups service's entrypoint.
    user: "${RECTO_UID:-65532}:${RECTO_UID:-65532}"
    depends_on:
      - cups
    ports:
      - "${RECTO_PORT:-8080}:8080"
    environment:
      # The address users reach recto at: sign-in redirects and the Secure cookie flag use it.
      RECTO_PUBLIC_URL: ${RECTO_PUBLIC_URL:?set RECTO_PUBLIC_URL to the address users open}
      # Single sign-on, optional: both or neither. Left empty, only local accounts sign in.
      RECTO_OIDC_ISSUER: ${RECTO_OIDC_ISSUER:-}
      RECTO_OIDC_CLIENT_ID: ${RECTO_OIDC_CLIENT_ID:-}
      RECTO_CUPS_URL: http://cups:631
      # CUPS's local socket, for the Printers page to add and manage printers. CUPS knows recto by
      # the `recto` account of the cups service's entrypoint, which carries RECTO_UID.
      RECTO_CUPS_ADMIN_SOCKET: /run/cups/cups.sock
      # Where "Save" on the scan page writes; it must be writable by RECTO_UID (chown 65532 consume).
      RECTO_SCAN_OUTPUT_DIR: /consume
      RECTO_LOG_FORMAT: ${RECTO_LOG_FORMAT:-json}
      # The database defaults to SQLite in the recto-data volume (sqlite:///data/recto.db). For
      # PostgreSQL, see examples/compose-postgres.yml.
      # RECTO_DATABASE_URL: postgres://recto:password@postgres:5432/recto
      # Behind a reverse proxy that overwrites X-Forwarded-For, so password sign-in attempts are
      # counted per client address rather than for everyone at once (see reverse-proxy.md):
      # RECTO_TRUST_FORWARDED_HEADERS: "true"
      # Other optional settings go here, for example to let only members of a Zitadel role in:
      # RECTO_OIDC_SCOPES: urn:zitadel:iam:org:projects:roles
      # RECTO_OIDC_REQUIRED_CLAIM: urn:zitadel:iam:org:project:roles
      # RECTO_OIDC_REQUIRED_VALUE: recto
    volumes:
      # The database (users, groups, sessions): back it up with `recto backup`, see
      # docs/src/how-to/back-up.md.
      - recto-data:/data
      - ./consume:/consume
      # Read-only is enough to connect to a socket.
      - cups-socket:/run/cups:ro
      # Docker's bridge network carries no multicast, so sane-airscan cannot discover scanners:
      # list them in airscan.conf. The Debian dll.conf probes every backend, which is slow in a
      # container; the one here enables airscan, escl and net only. net.conf lists saned hosts.
      # - ./examples/sane/airscan.conf:/etc/sane.d/airscan.conf:ro
      # - ./examples/sane/dll.conf:/etc/sane.d/dll.conf:ro
      # - ./examples/sane/net.conf:/etc/sane.d/net.conf:ro
    # A USB scanner needs its device node, which the image's user (65532) must be able to open
    # (a udev rule or a group on the host); never use `privileged`.
    # devices:
    #   - /dev/bus/usb:/dev/bus/usb
    read_only: true
    # libsane and the scan results write here.
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The image checks itself with `recto healthcheck`; `--wait` waits for it.

  cups:
    # A maintained multi-architecture (amd64, arm64) Debian CUPS server.
    # Pinned by the digest of the multi-architecture index. To update, run
    # `docker buildx imagetools inspect olbat/cupsd:latest` and copy its Digest.
    image: olbat/cupsd:latest@sha256:3a9d7c319f4153c87e16db4edb6ef6c317aa7e71f8abe65c3419cc9aca851194
    restart: unless-stopped
    # The image has no `recto` account, which cups-files.conf makes an administrator over the local
    # socket: CUPS matches the peer's uid with the passwd entry of the name recto sends, so the
    # account carries recto's uid, RECTO_UID, which Compose substitutes below. Its group keeps
    # 65532 whatever RECTO_UID is: every account whose main group has the number of the `recto`
    # group is an administrator, and the image's `print` account, whose password is known, has
    # group 1000. The image has no entrypoint of its own, its command is `cupsd -f`. Check this
    # again when the image digest changes.
    entrypoint:
      - /bin/sh
      - -c
      - |
        grep -q '^recto:' /etc/group || echo 'recto:x:65532:' >> /etc/group
        grep -q '^recto:' /etc/passwd || echo 'recto:x:${RECTO_UID:-65532}:65532:recto:/nonexistent:/usr/sbin/nologin' >> /etc/passwd
        exec /usr/sbin/cupsd -f
    volumes:
      # The named volume keeps the printers added with lpadmin (printers.conf lives in /etc/cups);
      # the file mounted over it is the one this repository controls.
      - cups-config:/etc/cups
      - ./examples/cups/cupsd.conf:/etc/cups/cupsd.conf:ro
      - ./examples/cups/cups-files.conf:/etc/cups/cups-files.conf:ro
      - cups-spool:/var/spool/cups
      # The socket recto administers CUPS through.
      - cups-socket:/run/cups
    # Publishing 631 exposes printing to whoever can reach the port (Docker's proxy hides their
    # address from cupsd.conf's allow list), so publish it only to a trusted network.
    # ports:
    #   - "127.0.0.1:631:631"
    # A printer attached by USB needs its device node; never use `privileged`.
    # devices:
    #   - /dev/bus/usb:/dev/bus/usb

# A fixed subnet, which examples/cups/cupsd.conf allows to print. Change both if it clashes.
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.80.0/24

volumes:
  recto-data:
  cups-config:
  cups-spool:
  cups-socket:
