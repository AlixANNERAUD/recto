# sane-airscan finds scanners with mDNS and WS-Discovery. Docker's default bridge network does
# not carry multicast, so inside a container list the scanners here instead.
[devices]
# "Office scanner" = http://192.168.1.50/eSCL, eSCL

[options]
# Discovery needs multicast; turn it off when the devices above are all you use.
# discovery = disable
