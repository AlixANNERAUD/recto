# recto's own eSCL scanners, found again through DNS-SD when recto advertises them on the same
# network: never list them back through SANE, which would scan from recto to recto. sane-airscan
# matches "model" against the ty TXT value, which recto always starts with "recto"; recto also
# leaves such devices out itself.
[blacklist]
model = "recto*"
