# SANE backends libsane loads, one per line. The Debian default enables every installed backend
# and probes USB for each, which is slow in a container. recto needs only these:
#   airscan  network scanners that speak eSCL or WSD (most recent Brother, Canon, Epson, HP)
#   escl     the sane-escl backend, an alternative for eSCL scanners
#   net      scanners shared by a saned host, see net.conf
airscan
escl
net
