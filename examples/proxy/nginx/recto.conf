# nginx in front of recto, on the same host (recto published on 127.0.0.1:8080).
# Replace recto.example.org, and get the certificate with: certbot certonly --nginx -d recto.example.org

server {
    listen 80;
    listen [::]:80;
    server_name recto.example.org;

    # Certbot's HTTP challenge also works through this redirect.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name recto.example.org;

    ssl_certificate     /etc/letsencrypt/live/recto.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recto.example.org/privkey.pem;

    # A little above RECTO_MAX_UPLOAD_SIZE (50 MiB by default), which recto accepts with 64 KiB
    # of form fields on top. nginx's own default is 1 MiB.
    client_max_body_size 51m;
    # Stream uploads to recto instead of writing them to a temporary file first.
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8080;

        # recto checks the Origin of sign-in posts against this host: keep it.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Replaces what the client sent. Use with RECTO_TRUST_FORWARDED_HEADERS=true.
        # $proxy_add_x_forwarded_for would keep the client's own value.
        proxy_set_header X-Forwarded-For $remote_addr;

        # A scan answers once the whole batch is read, which can take minutes.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Pages are per user and sw.js must stay fresh: let recto's Cache-Control decide, cache
        # nothing here. Without buffering, large PDFs are not copied to disk and refreshes are
        # not delayed.
        proxy_buffering off;
    }
}
