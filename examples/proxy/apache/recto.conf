# Apache httpd in front of recto, on the same host (recto published on 127.0.0.1:8080).
# Needs: a2enmod proxy proxy_http ssl headers rewrite http2
# Get the certificate with: certbot certonly --apache -d recto.example.org

<VirtualHost *:80>
    ServerName recto.example.org
    RewriteEngine on
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName recto.example.org

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/recto.example.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/recto.example.org/privkey.pem

    # At least RECTO_MAX_UPLOAD_SIZE (50 MiB = 52428800 bytes).
    LimitRequestBody 52428800

    # recto checks the Origin of sign-in posts against this host: keep it.
    ProxyPreserveHost On

    # Apache sets X-Forwarded-For by appending to the client's value, so drop the client's
    # first. Use with RECTO_TRUST_FORWARDED_HEADERS=true.
    RequestHeader unset X-Forwarded-For
    RequestHeader set X-Forwarded-Proto "https"

    # A scan answers once the whole batch is read, which can take minutes. The default is
    # the Timeout directive, 60 seconds.
    ProxyTimeout 600
    Timeout 600

    ProxyPass        / http://127.0.0.1:8080/ timeout=600
    ProxyPassReverse / http://127.0.0.1:8080/
</VirtualHost>
