# HAProxy in front of recto, on the same host (recto published on 127.0.0.1:8080).
# crt is a PEM with the certificate chain followed by the private key. With certbot:
#   cat fullchain.pem privkey.pem > /etc/haproxy/certs/recto.example.org.pem

global
    log stdout format raw local0
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client  600s
    # A scan answers once the whole batch is read, which can take minutes.
    timeout server  600s

frontend http
    bind :80
    redirect scheme https code 301

frontend https
    bind :443 ssl crt /etc/haproxy/certs/recto.example.org.pem alpn h2,http/1.1
    # Keep the Host header (HAProxy does by default): recto checks the Origin of sign-in
    # posts against it. These two replace whatever the client sent. Use the first with
    # RECTO_TRUST_FORWARDED_HEADERS=true.
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto https
    default_backend recto

backend recto
    server recto 127.0.0.1:8080 check
    option httpchk
    http-check send meth GET uri /health
    http-check expect status 200
