# cups-files.conf for the CUPS container of compose.yml.
#
# The olbat/cupsd image ships a user `print` (password `print`) in the `lpadmin` group, and the
# default SystemGroup is `root lpadmin`: anyone who can reach port 631 could then add or remove
# printers with those well-known credentials. Only root, over the local socket, is an
# administrator here (`docker compose exec cups lpadmin ...`).
SystemGroup root
PeerCred on
LogFileGroup adm
AccessLog /var/log/cups/access_log
ErrorLog /var/log/cups/error_log
PageLog /var/log/cups/page_log
