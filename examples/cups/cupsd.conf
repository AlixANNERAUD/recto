# cupsd.conf for the CUPS container of compose.yml.
#
# recto reaches CUPS by the name "cups" on the compose network, so CUPS must accept any Host
# header (ServerAlias *): without it CUPS answers recto with 400 and every page shows the
# printing service as unavailable.
Listen 0.0.0.0:631
# The local socket lets `docker compose exec cups lpadmin ...` run as root without a password.
Listen /run/cups/cups.sock
ServerAlias *
LogLevel warn
PageLogFormat

# recto shows jobs of every user, so job attributes must not be hidden from other users.
JobPrivateValues none
SubscriptionPrivateValues none

WebInterface No
DefaultAuthType Basic
MaxLogSize 0

# Only the compose network (the subnet fixed in compose.yml) and the container itself may print
# and see the queues. Docker's port proxy makes outside clients appear to come from the network's
# gateway, which is inside that subnet: publishing port 631 exposes printing to whoever can reach
# it, so keep it unpublished or put a firewall in front.
<Location />
  Order allow,deny
  Allow from 127.0.0.1
  Allow from 172.30.80.0/24
</Location>

# Adding and removing printers stays restricted to local administrators.
<Location /admin>
  Order allow,deny
  AuthType Default
  Require user @SYSTEM
</Location>

<Location /admin/conf>
  Order allow,deny
  AuthType Default
  Require user @SYSTEM
</Location>

<Policy default>
  JobPrivateAccess all
  JobPrivateValues none
  SubscriptionPrivateAccess all
  SubscriptionPrivateValues none

  <Limit Create-Job Print-Job Print-URI Validate-Job>
    Order deny,allow
  </Limit>

  <Limit Send-Document Send-URI Hold-Job Release-Job Restart-Job Purge-Jobs Set-Job-Attributes Create-Job-Subscription Renew-Subscription Cancel-Subscription Get-Notifications Reprocess-Job Cancel-Current-Job Suspend-Current-Job Resume-Job Cancel-My-Jobs Close-Job CUPS-Move-Job CUPS-Get-Document>
    Order deny,allow
  </Limit>

  # Recto cancels on behalf of the signed-in user, so any client on the network may cancel.
  <Limit Cancel-Job>
    Order deny,allow
  </Limit>

  <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default CUPS-Get-Devices>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>

  <Limit Pause-Printer Resume-Printer Enable-Printer Disable-Printer Pause-Printer-After-Current-Job Hold-New-Jobs Release-Held-New-Jobs Deactivate-Printer Activate-Printer Restart-Printer Shutdown-Printer Startup-Printer Promote-Job Schedule-Job-After Cancel-Jobs CUPS-Accept-Jobs CUPS-Reject-Jobs>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>

  <Limit All>
    Order deny,allow
  </Limit>
</Policy>
