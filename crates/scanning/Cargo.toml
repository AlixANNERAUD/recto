[package]
name = "recto-scanning"
description = "Scan models and the SANE client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Everything touching `image`, the filesystem or the clock stays out of the default build so the
# models compile for wasm32 in the browser bundle. The server and the `ssr` feature of the
# interface enable it. `uuid/v4` needs OS randomness, which the browser build must not pull in.
service = [
    "dep:image",
    "dep:chrono",
    "uuid/v4",
    "uuid/v5",
    "dep:async-trait",
    "dep:tokio",
    "dep:rustix",
    "dep:quick-xml",
    "dep:sha2",
    "dep:tempfile",
]
# Test doubles for the consumers of `ScannerService`. Never enabled in the release build.
testing = ["service"]
# The real scanners through libsane, which needs the SANE development files to build. The server
# binary enables it; the crate's own tests do too, so they cover the SANE test backend.
sane = ["service", "dep:libsane"]

[dependencies]
serde.workspace = true
thiserror.workspace = true
uuid.workspace = true
image = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
# renameat2 with RENAME_NOREPLACE, to publish saved scans without ever replacing a file.
rustix = { version = "1.1", features = ["fs"], optional = true }
libsane = { version = "0.1", features = ["image"], optional = true }
# eSCL: the ScanSettings parser, and the scanner keys (SHA-256 of the SANE id).
quick-xml = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
# The scan results' directory: named at random and private to recto.
tempfile = { workspace = true, optional = true }

[dev-dependencies]
# Enables `service` for this crate's own tests, so `cargo nextest run -p recto-scanning` compiles
# the service-gated ones without extra flags. Dev-dependencies never reach the wasm32 build.
recto-scanning = { path = ".", features = ["service", "testing", "sane"] }
tokio.workspace = true
tempfile.workspace = true
serde_json.workspace = true
