[package]
name = "recto-domain"
description = "Users, groups and the database of recto."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
recto-entity.workspace = true
recto-printing.workspace = true
recto-migration.workspace = true
sea-orm.workspace = true
thiserror.workspace = true
chrono.workspace = true
# The calendar periods of quotas follow RECTO_TIMEZONE.
chrono-tz.workspace = true
password-auth.workspace = true
# Password hashing runs on the blocking thread pool.
tokio.workspace = true
tracing.workspace = true
tempfile = { workspace = true, optional = true }

[features]
# Test helpers shared with the server crate's tests.
testing = ["dep:tempfile"]

[dev-dependencies]
recto-domain = { path = ".", features = ["testing"] }

[lints]
workspace = true
