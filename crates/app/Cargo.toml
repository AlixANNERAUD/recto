[package]
name = "recto-app"
description = "Web interface of recto."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
leptos.workspace = true
leptos_router.workspace = true
leptos_meta.workspace = true
leptos_axum = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
embedded-i18n.workspace = true
serde.workspace = true
uuid.workspace = true
tracing = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
# Browser APIs of the islands: file size checks, pointer selection on the scan preview, the
# scan Save request, and the page visibility that pauses the job list refresh.
web-sys = { workspace = true, optional = true, features = [
    "Blob",
    "Document",
    "DomRect",
    "Element",
    "EventTarget",
    "File",
    "FileList",
    "HtmlInputElement",
    "PointerEvent",
    "Request",
    "RequestInit",
    "Response",
    "Window",
] }
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
# Without their `service` feature these are the models only, which also build for the browser.
recto-printing.workspace = true
recto-scanning.workspace = true
# The server functions read the database; the browser build must not pull it.
recto-domain = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
chrono-tz = { workspace = true, optional = true }

[features]
default = []
hydrate = [
    "leptos/hydrate",
    "dep:web-sys",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
]
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:leptos_axum",
    "dep:axum",
    "dep:sea-orm",
    "dep:chrono-tz",
    "dep:tracing",
    "dep:tokio",
    "dep:recto-domain",
    "recto-printing/service",
    "recto-scanning/service",
]

[lints]
workspace = true
