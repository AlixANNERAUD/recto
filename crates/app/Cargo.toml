[package]
name = "recto-app"
description = "Web interface of recto."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
leptos.workspace = true
leptos_router.workspace = true
leptos_meta.workspace = true
leptos_axum = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
embedded-i18n.workspace = true
serde.workspace = true
# Without their `service` feature these are the models only, which also build for the browser.
recto-printing.workspace = true
recto-scanning.workspace = true
recto-authentication = { workspace = true, optional = true }

[features]
default = []
hydrate = ["leptos/hydrate"]
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:leptos_axum",
    "dep:axum",
    "dep:recto-authentication",
    "recto-printing/service",
    "recto-scanning/service",
]

[lints]
workspace = true
