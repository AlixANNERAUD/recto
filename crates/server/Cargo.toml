[package]
name = "recto"
description = "Self-hosted web app to print and scan behind OpenID Connect."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "recto"
path = "src/lib.rs"

[[bin]]
name = "recto"
path = "src/main.rs"

[dependencies]
recto-app = { workspace = true, features = ["ssr"] }
recto-printing = { workspace = true, features = ["service"] }
recto-scanning = { workspace = true, features = ["sane"] }
recto-authentication.workspace = true
leptos = { workspace = true, features = ["ssr"] }
leptos_axum.workspace = true
axum = { workspace = true, features = ["multipart"] }
tower-sessions.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
async-trait.workspace = true
tower-http.workspace = true
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true
url.workspace = true

[features]
# A route signing anyone in without a provider, for this package's own tests. It is enabled by
# the dev-dependency below only, so no build of the binary ever contains it.
testing = []

[dev-dependencies]
recto = { path = ".", features = ["testing"] }
recto-printing = { workspace = true, features = ["testing"] }
recto-scanning = { workspace = true, features = ["testing"] }
tower.workspace = true
tempfile.workspace = true
wiremock.workspace = true

[lints]
workspace = true
