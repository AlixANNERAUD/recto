[package]
name = "recto"
description = "Self-hosted web app to print and scan behind OpenID Connect."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "recto"
path = "src/lib.rs"

[[bin]]
name = "recto"
path = "src/main.rs"

[features]
# `RECTO_DEV_MOCKS=1` for `mise run dev`: mock CUPS and SANE and a fixed signed-in user. Debug
# builds only; a release build with it does not compile.
dev-mocks = ["recto-printing/testing", "recto-scanning/testing"]

[dependencies]
recto-app = { workspace = true, features = ["ssr"] }
recto-printing = { workspace = true, features = ["service"] }
recto-scanning = { workspace = true, features = ["sane"] }
recto-authentication.workspace = true
recto-domain.workspace = true
recto-entity.workspace = true
sea-orm.workspace = true
chrono.workspace = true
leptos = { workspace = true, features = ["ssr"] }
leptos_axum.workspace = true
axum = { workspace = true, features = ["multipart"] }
tower-sessions.workspace = true
tower_governor.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
async-trait.workspace = true
tower-http.workspace = true
tower.workspace = true
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true
url.workspace = true

[dev-dependencies]
recto-domain = { workspace = true, features = ["testing"] }
recto-printing = { workspace = true, features = ["testing"] }
recto-scanning = { workspace = true, features = ["testing"] }
tempfile.workspace = true
wiremock.workspace = true

[lints]
workspace = true
