[package]
name = "recto-printing"
description = "Print models and the CUPS/IPP client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Everything touching `ipp` or `bytes` stays out of the default build so the models compile for
# wasm32 in the browser bundle. The server and the `ssr` feature of the interface enable it.
# The virtual printer names itself and its jobs with UUID v5 and dates its attributes with chrono.
service = ["dep:ipp", "ipp/chrono", "dep:bytes", "dep:async-trait", "dep:url", "dep:percent-encoding", "dep:reqwest", "dep:lopdf", "dep:flate2", "dep:tokio", "dep:uuid", "uuid/v5", "dep:chrono"]
# Test doubles for the consumers of `PrintService`. Never enabled in the release build.
testing = ["service"]

[dependencies]
serde.workspace = true
thiserror.workspace = true
ipp = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
url = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
percent-encoding = { workspace = true, optional = true }
lopdf = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }

[dev-dependencies]
# Enables `service` for this crate's own tests, so `cargo nextest run -p recto-printing` compiles
# the service-gated ones without extra flags. Dev-dependencies never reach the wasm32 build.
recto-printing = { path = ".", features = ["service", "testing"] }
tokio = { workspace = true, features = ["net", "io-util"] }
tempfile.workspace = true
wiremock.workspace = true
# Reads the PDFs that rasters become, and checks their pixels against a reference decoder's.
lopdf.workspace = true
sha2.workspace = true
